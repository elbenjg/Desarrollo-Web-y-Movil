        <h2>Agregar pelicula</h2>
        <form action="agrg_pl.php" method="post">
            <div class="mb-3 mt-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ingrese nombre de la pelicula" name="nombre" required>
            </div>
            <div class="mb-3">
                <label for="director" class="form-label">Director:</label>
                <input type="text" class="form-control" id="director" placeholder="Ingrese director de la pelicula" name="director" required>
            </div>
            <div class="mb-3">
                <label for="genero" class="form-label">Genero:</label>
                <input type="text" class="form-control" id="genero" placeholder="Ingrese genero de la pelicula" name="genero" required>
            </div>
            <div class="mb-3">
                <label for="anio" class="form-label">Año:</label>
                <input type="number" class="form-control" id="anio" placeholder="Ingrese año de la pelicula" name="anio" required>

            <button type="submit" class="btn btn-primary">Agregar</button>
